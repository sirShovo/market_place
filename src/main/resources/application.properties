spring.application.name=market_place

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/market_place_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration for automatic table generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (Audit Logs)
spring.data.mongodb.uri=mongodb://localhost:27017/market_place_audit_db

# JWT Configuration
app.jwt.secret=MarketPlaceSuperSecretKeyForJWTSignature2024Minimum256BitsRequired!
app.jwt.expiration-ms=86400000

# Business Configuration, Payment Simulation & Scheduler
app.payment.approval-probability=0.7
app.order.unpaid-expiration-minutes=30
app.scheduler.order-expiration-delay-ms=60000

# Initial ADMIN Bootstrap Configuration
app.seed.enabled=true
app.seed.admin.username=admin
app.seed.admin.password=admin123
app.seed.admin.identification=ADMIN-001
app.seed.admin.email=admin@nexusmarket.com
app.seed.admin.full-name=System Administrator

# SMTP Configuration (to be configured later)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
