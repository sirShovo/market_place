spring.application.name=market-place-api

# Base de datos (MySQL Local)
# La base de datos debe ser creada previamente en MySQL: CREATE DATABASE marketplace_db;
spring.datasource.url=jdbc:mysql://localhost:3306/marketplace_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=0000
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion de Hibernate para la generacion automatica de tablas
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT Configuration
# La clave debe ser segura y lo suficientemente larga (minimo 256 bits para HS256)
app.jwt.secret=MarketPlaceSuperSecretKeyParaFirmaDeTokensJWT2024Min256BitsLargo!
app.jwt.expiration-ms=86400000

# Configuracion de Correo (SMTP Simulacion o Real - JavaMailSender)
# Reemplazar con credenciales reales para envio de correos (ej. Gmail, Mailtrap)
spring.mail.host=smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=test_user
spring.mail.password=test_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
