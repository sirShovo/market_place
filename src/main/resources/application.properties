spring.application.name=${SPRING_APPLICATION_NAME:market_place}
server.port=${SERVER_PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/market_place_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:0000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate Configuration for automatic table generation
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# MongoDB Configuration (Audit Logs)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/market_place_audit_db}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MarketPlaceSuperSecretKeyForJWTSignature2024Minimum256BitsRequired!}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Business Configuration, Payment Simulation & Scheduler
app.payment.approval-probability=${PAYMENT_APPROVAL_PROBABILITY:0.7}
app.order.unpaid-expiration-minutes=${ORDER_UNPAID_EXPIRATION_MINUTES:30}
app.scheduler.order-expiration-delay-ms=${ORDER_EXPIRATION_SCHEDULER_DELAY_MS:60000}

# Initial ADMIN Bootstrap Configuration
app.seed.enabled=${SEED_ENABLED:true}
app.seed.admin.username=${SEED_ADMIN_USERNAME:admin}
app.seed.admin.password=${SEED_ADMIN_PASSWORD:admin123}
app.seed.admin.identification=${SEED_ADMIN_IDENTIFICATION:ADMIN-001}
app.seed.admin.email=${SEED_ADMIN_EMAIL:admin@nexusmarket.com}
app.seed.admin.full-name=${SEED_ADMIN_FULL_NAME:System Administrator}

# SMTP Configuration (Optional - falls back to application log if unreachable)
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:your-email@gmail.com}
spring.mail.password=${SMTP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
